# ==============================================================================
#                      ROYITEMS — CONFIGURATION ENGINE
# ==============================================================================
config-version: 2

# General settings
debug: false

# Active localization language:
# Supported: en-US, vi-VN, de-DE, ja-JP, ko-KR, ru-RU, es-ES (or custom lang/<language>.yml)
language: en-US

# Provider preference when multiple MMORPG providers exist (MMOCore, AuraSkills, Auto)
mana-provider: Auto

# Performance tuning
performance:
  # Frequency in seconds for item expiration check (low overhead)
  expiration-check-interval: 20
  # Frequency in seconds for periodic potion effect application
  potion-effect-interval: 3

# ==============================================================================
# UPDATE CHECKER
# Automatically checks for new releases on Modrinth (https://modrinth.com/plugin/royitems)
# and notifies server administrators.
#
# NOTE: Only 'enabled' and 'notify-admins-on-join' are editable by server administrators.
# Any unauthorized modifications will be automatically reverted upon reload or restart.
# ==============================================================================
update-checker:
  enabled: true
  notify-admins-on-join: true

# ==============================================================================
# COMBAT & CUSTOM DEFENSE SYSTEM
# 'defense' is an independent custom stat directly mitigating incoming damage,
# operating cleanly without conflicting with Vanilla Armor or Armor Toughness.
# ==============================================================================
combat:
  # Particle and sound effects when an attack triggers a critical strike
  critical-hit-particles: true

  # Completely removes damage indicator heart particles (DAMAGE_INDICATOR) from reaching player clients
  # via PacketEvents or ProtocolLib to eliminate screen freeze/stutter during high MMORPG damage hits
  disable-damage-heart-particles: true

  # Hard ceiling for final damage reduction percentage (Damage Reduction stat)
  # Example: 0.85 = maximum 85% of incoming damage can be absorbed
  max-damage-reduction: 0.85

  defense:
    # --------------------------------------------------------------------------
    # DEFENSE CALCULATION MODE
    # Choose one of three calculation modes:
    #   - SIMPLE: Direct subtraction (Final Damage = Attack Damage - Defense).
    #   - MMORPG: Non-linear scaling curve with diminishing returns.
    #   - CUSTOM_LIMIT: Flat subtraction bounded by Min and Max damage limits.
    # --------------------------------------------------------------------------
    mode: "MMORPG"

    # MODE 1 — SIMPLE
    # Formula: Final Damage = Attack Damage - Effective Defense
    # Allows negative intermediate values when defense exceeds damage,
    # safely clamping at floor-damage to prevent accidental player healing.
    simple:
      floor-damage: 0.0

    # MODE 2 — MMORPG (Diminishing returns non-linear mitigation)
    # Formula: Final Damage = Damage * (scale / (scale + Effective Defense)) * damage-factor
    # Example with scale = 100:
    #   - 100 Defense -> 50% damage reduction
    #   - 200 Defense -> 66.7% damage reduction
    #   - 300 Defense -> 75% damage reduction
    # Guarantees that lower-damage players will always deal baseline chip damage to high-defense targets.
    mmorpg:
      scale: 100.0
      damage-factor: 1.0
      min-damage-floor: 1.0

    # MODE 3 — CUSTOM DAMAGE LIMIT
    # Formula: Attack Damage - Effective Defense, then bounded by clamp thresholds:
    #   - min-damage: Minimum damage floor dealt per attack (even if subtracted below zero).
    #   - max-damage: Maximum damage ceiling allowed per single hit.
    custom-limit:
      min-damage:
        enabled: true
        value: 2.0
      max-damage:
        enabled: false
        value: 100.0
