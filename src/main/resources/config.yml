# ==============================================================================
#                      ROYITEMS — CONFIGURATION ENGINE
# ==============================================================================
config-version: 2

# General settings
debug: false

# Active localization language:
# Supported: en-US, vi-VN, de-DE, ja-JP, ko-KR, ru-RU, es-ES (or custom lang/<language>.yml)
language: en-US

# Provider preference when multiple MMORPG providers exist (MMOCore, AuraSkills, Auto)
mana-provider: Auto

# Performance tuning
performance:
  # Frequency in seconds for item expiration check (low overhead)
  expiration-check-interval: 20
  # Frequency in seconds for periodic potion effect application
  potion-effect-interval: 3

# ==============================================================================
# UPDATE CHECKER
# Automatically checks for new releases on Modrinth (https://modrinth.com/plugin/royitems)
# and notifies server administrators.
#
# NOTE: Only 'enabled' and 'notify-admins-on-join' are editable by server administrators.
# Any unauthorized modifications will be automatically reverted upon reload or restart.
# ==============================================================================
update-checker:
  enabled: true
  notify-admins-on-join: true

# ==============================================================================
# COMBAT & CUSTOM DEFENSE SYSTEM
# 'defense' is an independent custom stat directly mitigating incoming damage,
# operating cleanly without conflicting with Vanilla Armor or Armor Toughness.
# ==============================================================================
combat:
  # Particle and sound effects when an attack triggers a critical strike
  critical-hit-particles: true

  # Completely removes damage indicator heart particles (DAMAGE_INDICATOR) from reaching player clients
  # via PacketEvents or ProtocolLib to eliminate screen freeze/stutter during high MMORPG damage hits
  disable-damage-heart-particles: true

  # Hard ceiling for final damage reduction percentage (Damage Reduction stat)
  # Example: 0.85 = maximum 85% of incoming damage can be absorbed
  max-damage-reduction: 0.85

  defense:
    # --------------------------------------------------------------------------
    # DEFENSE CALCULATION MODE
    # Choose one of three calculation modes:
    #   - SIMPLE: Direct subtraction (Final Damage = Attack Damage - Defense).
    #   - MMORPG: Non-linear scaling curve with diminishing returns.
    #   - CUSTOM_LIMIT: Flat subtraction bounded by Min and Max damage limits.
    # --------------------------------------------------------------------------
    mode: "MMORPG"

    # MODE 1 — SIMPLE
    # Formula: Final Damage = Attack Damage - Effective Defense
    # Allows negative intermediate values when defense exceeds damage,
    # safely clamping at floor-damage to prevent accidental player healing.
    simple:
      floor-damage: 0.0

    # MODE 2 — MMORPG (Diminishing returns non-linear mitigation)
    # Formula: Final Damage = Damage * (scale / (scale + Effective Defense)) * damage-factor
    # Example with scale = 100:
    #   - 100 Defense -> 50% damage reduction
    #   - 200 Defense -> 66.7% damage reduction
    #   - 300 Defense -> 75% damage reduction
    # Guarantees that lower-damage players will always deal baseline chip damage to high-defense targets.
    mmorpg:
      scale: 100.0
      damage-factor: 1.0
      min-damage-floor: 1.0

    # MODE 3 — CUSTOM DAMAGE LIMIT
    # Formula: Attack Damage - Effective Defense, then bounded by clamp thresholds:
    #   - min-damage: Minimum damage floor dealt per attack (even if subtracted below zero).
    #   - max-damage: Maximum damage ceiling allowed per single hit.
    custom-limit:
      min-damage:
        enabled: true
        value: 2.0
      max-damage:
        enabled: false
        value: 100.0

# ==============================================================================
# PERMISSION STATS SYSTEM
# Dynamically grants custom MMORPG stats and Vanilla attributes to players
# based on LuckPerms groups, user permissions, inheritance, and temporary nodes.
# Does NOT require equipping or holding any RoyItems custom items.
#
# Formats:
#   - Flat Value:       royitems.player.stats.<stat>.<value>    (e.g. .attack-damage.10, .defense.15)
#   - Percentage Value: royitems.player.stats.<stat>.<value>%   (e.g. .crit-rate.15%, .movement-speed.10%)
# ==============================================================================
permission-stats:
  # Enable or disable player stat bonuses from permissions
  enabled: true

  # Conflict resolution mode when a player has multiple permissions for the same stat:
  #   - HIGHEST (default): Selects the highest flat value and highest percentage value independently.
  #   - SUM: Adds together all flat values and all percentage values.
  conflict-resolution: "HIGHEST"

  # Optional caps on maximum bonus values granted via permissions (0 = unlimited / no cap)
  caps:
    max-health: 0.0
    movement-speed: 0.0
    attack-damage: 0.0
    defense: 0.0

# ==============================================================================
# LIVE UPDATE SYSTEM
# Automatically updates existing custom items across online player inventories,
# equipment, off-hand, and ender chests when an administrator reloads the plugin
# (/royitems reload) or saves item modifications in the Ingame GUI Editor.
# Players never need to reconnect or drop items for stat/lore changes to take effect.
# ==============================================================================
live-update:
  # Enable or disable the entire LiveUpdate mechanism
  enabled: true

  # Automatically trigger LiveUpdate across all online players upon /royitems reload
  auto-update-on-reload: true

  # Performance throttling to prevent sudden TPS drops when many players/items are online.
  # Spreads updates cleanly across multiple ticks (0 = unlimited).
  performance:
    max-players-per-tick: 5
    max-items-per-tick: 40
    tick-interval: 1

  # Containers to scan and synchronize
  containers:
    inventory: true      # Player storage slots (0-35)
    armor: true          # Helmet, chestplate, leggings, and boots equipment slots
    offhand: true        # Off-hand shield/item slot
    ender-chest: true    # Player Ender Chest storage contents

  # Data preservation settings during LiveUpdate:
  # - Set to true: preserves the item's current in-game state (prevents overwrite)
  # - Set to false: updates/refreshes the property according to the latest item definition
  preserve:
    # Preserve enchantments applied by players via anvil, enchanting table, or custom plugins
    enchantments: true

    # Preserve slotted gem stones and socket state (true = keep slotted gems)
    gems: true

    # Preserve current item durability / damage state (true = keep current wear)
    durability: true

    # Preserve custom display name if renamed via anvil by the player
    # (false = reset/update to the latest display name configured in item YAML)
    display-name: false

    # Preserve custom lore lines (false = rebuild lore dynamically with latest stats and formats)
    lore: false

    # Preserve item tier assigned in game (false = synchronize with latest definition tier)
    tier: false

    # Preserve custom model data (false = synchronize with latest definition model)
    custom-model-data: false

    # Preserve third-party PersistentDataContainer (PDC) and custom NBT tags from other plugins
    pdc: true

    # Preserve existing attribute modifiers
    # (false = update stats and vanilla attributes to match the new configuration immediately)
    attributes: false

# ==============================================================================
# ENCHANTMENT SYSTEM & ECOENCHANTS INTEGRATION
# Controls dynamic enchantment recognition, formatting in #enchantments#,
# and instant synchronization when items are enchanted.
# ==============================================================================
enchantments:
  # Automatically synchronize #enchantments# dynamic lore upon Anvil combination,
  # Enchanting Table, Enchanted Books, /enchant commands, or EcoEnchants scrolls
  auto-sync-lore: true

  # Hide the default vanilla grey enchantment tooltip so enchantments are only
  # rendered cleanly via RoyItems' #enchantments# lore placeholder (no duplicate lines)
  hide-vanilla-tooltip: true

  # Default enchantment line format when not specified in individual lore-format file
  default-format: "&7%name% %level%"

  # Format for curse enchantments (Curse of Binding, Curse of Vanishing)
  curse-format: "&c%name% %level%"

  # Optional prefix symbol (e.g. "✦ " or "")
  symbol: ""

  # Numbering style for enchantment levels: ROMAN (I, II, III, IV, V) or NUMBER (1, 2, 3, 4, 5)
  level-style: "ROMAN"

  # Display sorting order: VANILLA_FIRST, ECO_FIRST, ALPHABETICAL, LEVEL_DESC, LEVEL_ASC
  order: "VANILLA_FIRST"

  # Real-time synchronization check interval in ticks for active hand items (10 ticks = 0.5s)
  # Automatically updates enchantment lore when modified via console/admin /enchant commands while idle
  check-interval-ticks: 10

  # Optional global custom display name overrides for specific enchantments
  # custom-names:
  #   sharpness: "&cSắc Bén"
  #   unbreaking: "&aBền Bỉ"

# ==============================================================================
# ANVIL MECHANICS & RESTRICTIONS
# ==============================================================================
anvil:
  # Prevent players from renaming RoyItems items using an anvil.
  # When true (default):
  #   - Renaming is strictly blocked (including color codes, unicode, and special characters).
  #   - Repairing, combining, and applying Vanilla / EcoEnchants enchantments still work normally.
  # When false:
  #   - Allows players to rename RoyItems items according to vanilla anvil mechanics.
  prevent-rename: true

# ==============================================================================
# SMITHING TABLE RESTRICTIONS
# ==============================================================================
smithing-table:
  # Prevent players from upgrading or trimming RoyItems using a Smithing Table.
  # When true (default):
  #   - Blocks vanillaizing / corrupting RoyItems via Netherite upgrades or Armor Trims.
  # When false:
  #   - Allows players to use Smithing Table on RoyItems (may result in loss of custom stats/data).
  prevent-corrupt: true

# ==============================================================================
# GRINDSTONE RESTRICTIONS
# ==============================================================================
grindstone:
  # Prevent players from removing pre-configured enchantments from RoyItems using a Grindstone.
  # When true (default):
  #   - Disenchanting pre-configured enchantments or combining items that would destroy RoyItems is blocked.
  #   - Items without pre-configured enchantments and vanilla items can still use Grindstone normally.
  # When false:
  #   - Allows players to disenchant any RoyItem using a Grindstone.
  prevent-disenchant-configured: true

# ==============================================================================
# ENCHANTMENT EXTRACTION (CONSUMABLE REMOVE-ENCHANTS)
# ==============================================================================
enchantment-extraction:
  # Protect pre-configured default enchantments on RoyItems items.
  # When true (default):
  #   - Default enchantments defined in the item's YAML cannot be completely removed.
  # When false:
  #   - Players can extract any enchantment matching the scroll's filter.
  protect-default-enchantments: true

  # Handling when an enchantment is present in default config but was upgraded by player/admin to a higher level:
  # false (default - Option 2):
  #   - Completely lock enchantments that exist in default config. Players cannot extract them at all.
  # true (Option 1):
  #   - Allow downgrading the enchantment back to its default level, keeping the default level on the item.
  allow-downgrade-to-default: false

  # Book returned when downgrading an upgraded default enchantment (only applies when allow-downgrade-to-default: true):
  #   - "DIFFERENCE" / "UPGRADED" (default): Returns book with the extra levels added (e.g., Level 5 -> 3 returns Level 2 book: 5 - 3 = 2).
  #   - "CURRENT" / "FULL": Returns book with the full level prior to extraction (e.g., Level 5).
  downgrade-book-level: "DIFFERENCE"

# ==============================================================================
# MINE RADIUS MECHANICS & EXECUTOR
# Controls wide-area horizontal plane mining for items with type: TOOL
# and the mine-radius stat (3x3, 5x5, 7x7, 9x9, 11x11...).
# ==============================================================================
mine-radius:
  # Enable or disable the entire mine radius feature
  enabled: true

  # Activation chance percentage (0.0 - 100.0)
  activation-chance: 100.0

  # Cooldown between mine radius triggers in milliseconds (0 = no cooldown)
  cooldown-ms: 0

  # Performance limits and safety bounds
  limits:
    # Maximum allowed radius tier (1 = 3x3, 2 = 5x5, 3 = 7x7, 4 = 9x9, 5 = 11x11)
    max-radius-tier: 5
    # Absolute ceiling on blocks broken per single hit to ensure 20 TPS server stability
    max-blocks-per-break: 150

  # ExtraStorage hook settings: seamlessly transfer mined drops to player storage
  extra-storage:
    # Automatically deposit mined radius drops into ExtraStorage if available
    auto-deposit: true
    # If storage is full or reaches capacity, drop leftover items safely into the world
    drop-leftover-to-world: true

  # AdvancedOreGen integration: seamlessly regenerate cobblestone/ore generator blocks
  # in place without turning them to AIR, keeping water/fence/lava generator machines 100% stable
  advanced-ore-gen:
    # Automatically regenerate generator blocks in-place using AdvancedOreGen's generation pipeline
    auto-regenerate: true

  # Whitelist of materials that can trigger and be mined by Mine Radius.
  # Other block types (e.g. Bedrock, Chests, Spawners, Obsidian) are completely protected.
  allowed-blocks:
    # Vanilla Stones & Deepslate
    - STONE
    - GRANITE
    - DIORITE
    - ANDESITE
    - DEEPSLATE
    - TUFF
    - CALCITE
    - COBBLESTONE
    - COBBLED_DEEPSLATE
    - NETHERRACK
    - BASALT
    - BLACKSTONE
    - END_STONE
    - SANDSTONE
    - RED_SANDSTONE
    # Regular Ores
    - COAL_ORE
    - IRON_ORE
    - COPPER_ORE
    - GOLD_ORE
    - REDSTONE_ORE
    - EMERALD_ORE
    - LAPIS_ORE
    - DIAMOND_ORE
    - NETHER_QUARTZ_ORE
    - NETHER_GOLD_ORE
    - ANCIENT_DEBRIS
    # Deepslate Ore Variants
    - DEEPSLATE_COAL_ORE
    - DEEPSLATE_IRON_ORE
    - DEEPSLATE_COPPER_ORE
    - DEEPSLATE_GOLD_ORE
    - DEEPSLATE_REDSTONE_ORE
    - DEEPSLATE_EMERALD_ORE
    - DEEPSLATE_LAPIS_ORE
    - DEEPSLATE_DIAMOND_ORE

  # Whitelist of tools allowed to trigger Mine Radius
  allowed-tools:
    - WOODEN_PICKAXE
    - STONE_PICKAXE
    - IRON_PICKAXE
    - GOLDEN_PICKAXE
    - DIAMOND_PICKAXE
    - NETHERITE_PICKAXE
    - WOODEN_SHOVEL
    - STONE_SHOVEL
    - IRON_SHOVEL
    - GOLDEN_SHOVEL
    - DIAMOND_SHOVEL
    - NETHERITE_SHOVEL
    - WOODEN_AXE
    - STONE_AXE
    - IRON_AXE
    - GOLDEN_AXE
    - DIAMOND_AXE
    - NETHERITE_AXE
    - WOODEN_HOE
    - STONE_HOE
    - IRON_HOE
    - GOLDEN_HOE
    - DIAMOND_HOE
    - NETHERITE_HOE

# ==============================================================================
# ITEM SET BONUS & NOTIFICATIONS
# Controls automated notifications when a player activates or deactivates an Item Set bonus.
# ==============================================================================
set-bonus:
  notifications:
    # Send notification when a player equips enough pieces to activate the set bonus
    activated: true
    # Send notification when a player unequips pieces and loses the set bonus
    deactivated: true
    # Debounce delay in ticks to prevent notification spam during rapid inventory clicks
    debounce-ticks: 2

# ==============================================================================
# VOUCHER & TITLE GACHA ANIMATION
# Advanced currency rewards, random reward gacha rolling, and anti-dupe safety.
# ==============================================================================
voucher:
  gacha:
    # Enable animated rolling title for random voucher rewards (min-max)
    # Note: Fixed amount vouchers will never roll gacha; they are awarded instantly.
    enabled: true
    # Duration of the rolling animation in ticks (30 ticks = 1.5 seconds)
    duration-ticks: 30
    # Interval between number changes in ticks (2 ticks = 10 rolls/second)
    interval-ticks: 2
    # Rolling sound effect
    sound-roll: "BLOCK_NOTE_BLOCK_PLING"
    sound-roll-pitch-min: 1.0
    sound-roll-pitch-max: 1.8
    # Finished / reward granted sound effect
    sound-finish: "UI_TOAST_CHALLENGE_COMPLETE"
    sound-finish-volume: 1.0
    sound-finish-pitch: 1.2
    # Particle effect when the reward is finalized
    particle: "FIREWORK"
    particle-count: 35
    # Title display format during rolling
    title-rolling: "<gold><bold>GACHA ROLLING...</bold></gold>"
    subtitle-rolling: "<yellow>#symbol##amount# <gray>(#currency#)</gray></yellow>"
    # Title display format upon final reward
    title-finish: "<green><bold>REWARD UNLOCKED!</bold></green>"
    subtitle-finish: "<yellow>+ #symbol##amount# <gold>#currency#</gold></yellow>"

  ecoenchants-gacha:
    # Enable animated rolling title for random EcoEnchants book voucher rewards
    enabled: true
    # Duration of the rolling animation in ticks (30 ticks = 1.5 seconds)
    duration-ticks: 30
    # Interval between enchantment name cycling in ticks (2 ticks = 10 rolls/second)
    interval-ticks: 2
    # Title display timing in ticks for the reveal phase (20 ticks = 1 second)
    times:
      fade-in-ticks: 5
      stay-ticks: 50
      fade-out-ticks: 15
    # Rolling sound effect
    sound-roll: "BLOCK_NOTE_BLOCK_PLING"
    sound-roll-pitch-min: 1.0
    sound-roll-pitch-max: 1.8
    # Finished / reveal sound effect
    sound-reveal: "UI_TOAST_CHALLENGE_COMPLETE"
    sound-reveal-volume: 1.0
    sound-reveal-pitch: 1.2
    # Particle effect when the reward is revealed
    particle: "FIREWORK"
    particle-count: 35
    # Title display format during rolling
    title-rolling: "<gold><bold>✦ ECOENCHANTS GACHA ✦</bold></gold>"
    subtitle-rolling: "<gray>Rolling: </gray>#enchantment# <yellow>#level#</yellow> <dark_gray>(#rarity#)</dark_gray>"
    # Title display format upon final reveal
    title-reveal: "<green><bold>★ ENCHANTMENT UNLOCKED ★</bold></green>"
    subtitle-reveal: "#enchantment# <yellow>#level#</yellow> <dark_gray>•</dark_gray> #rarity#"

# ==============================================================================
# CURRENCIES DISPLAY & FORMATTING
# Friendly display names, symbols, and formatting for all supported economy engines.
# Prevents raw identifiers (e.g. EXCELLENTECONOMY_gems, VAULT) from ever showing to players.
# ==============================================================================
currencies:
  vault:
    name: "Money"
    symbol: "$"
    format: "#,##0.##"
  playerpoints:
    name: "Points"
    symbol: "✪"
    format: "#,##0"
  coins:
    name: "Coins"
    symbol: "⛁"
    format: "#,##0.##"
  gems:
    name: "Gems"
    symbol: "♦"
    format: "#,##0"



