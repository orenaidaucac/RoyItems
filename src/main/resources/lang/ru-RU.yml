  station-created: "&aСтанция крафта успешно создана: &ecrafting-station/#station#.yml&a!"
  station-create-failed: "&cСтанция &f#station# &cуже существует или не может быть создана!"
  station-deleted: "&aСтанция крафта успешно удалена: &ecrafting-station/#station#.yml&a!"
  station-delete-failed: "&cСтанция &f#station# &cне существует или не может быть удалена!"
