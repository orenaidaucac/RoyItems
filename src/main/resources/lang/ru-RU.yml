  voucher-redeemed-currency: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &aВы использовали &e#item# &aи получили &e#symbol##amount# #currency#&a!"
  voucher-in-progress: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cВы уже открываете ваучер! Пожалуйста, дождитесь окончания анимации."
  voucher-cooldown: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cПодождите &f#time#с &cперед повторным использованием ваучера!"
  voucher-transaction-failed: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cНе удалось выдать награду. Транзакция была безопасно отменена."
  voucher-invalid-config: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cНекорректная конфигурация ваучера. Обратитесь к администратору."
  voucher-currency-unavailable: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cЭкономическая система для #currency# в данный момент недоступна."
  voucher-ecoenchants-reward: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &aВы активировали &e#item# &aи получили &f#enchantment# <yellow>#level#</yellow> &7(#rarity#)&a!"
