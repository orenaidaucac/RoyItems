  voucher-ecoenchants-no-enchantments: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cНе найдено подходящих чар EcoEnchants для данной конфигурации ваучера."
  voucher-inventory-full-dropped: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &eВаш инвентарь полон, поэтому награда была сброшена вам под ноги!"

  # Система извлечения чар (Enchantment Extraction)
