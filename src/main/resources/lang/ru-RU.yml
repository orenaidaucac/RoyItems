  craft-failed-ingredients: "&cУ вас недостаточно материалов для создания по этому рецепту!"
  craft-failed-inventory-full: "&cВаш инвентарь полон! Невозможно создать предмет."
  craft-countdown-start: "&eСоздание &f#recipe#&e... Пожалуйста, не закрывайте меню! (&f#time#с&e)"
  craft-completed: "&aСоздание &e#recipe# &aзавершено!"
  craft-failed: "&cСоздание не удалось из-за нехватки ингредиентов!"
