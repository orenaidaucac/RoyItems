  voucher-redeemed-currency: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &a¡Canjeaste &e#item# &ay recibiste &e#symbol##amount# #currency#&a!"
  voucher-in-progress: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &c¡Ya estás tirando un vale! Por favor espera a que finalice la animación."
  voucher-cooldown: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &c¡Por favor espera &f#time#s &cpara volver a usar este vale!"
  voucher-transaction-failed: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cError al depositar la recompensa. La transacción se canceló de forma segura."
  voucher-invalid-config: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cConfiguración del vale no válida. Por favor contacta a un administrador."
  voucher-currency-unavailable: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cEl proveedor de economía para #currency# no está disponible actualmente."
  voucher-ecoenchants-reward: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &a¡Has canjeado &e#item# &ay recibido &f#enchantment# <yellow>#level#</yellow> &7(#rarity#)&a!"
  voucher-ecoenchants-unavailable: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cEcoEnchants no está instalado o disponible actualmente en este servidor."
  voucher-ecoenchants-no-enchantments: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &cNo se encontraron encantamientos de EcoEnchants para esta configuración de vale."
  voucher-inventory-full-dropped: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &e¡Tu inventario estaba lleno, así que la recompensa se soltó a tus pies!"

  # Sistema de Extracción de Encantamientos
