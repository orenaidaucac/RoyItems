  station-not-found: "&c¡La estación de fabricación &f#station# &cno existe!"
  station-no-permission: "&cNo tienes permiso para acceder a esta estación de fabricación."
  station-opened: "&aEstación de fabricación &e#station# &aabierta para &f#player#&a."
  station-list-header: "&eEstaciones de fabricación activas (&f#count#&e):"
  station-list-item: " &7• &e#id# &7(#title#&7) &8| &f#recipes# &7recetas"
  station-created: "&a¡Estación de fabricación creada con éxito: &ecrafting-station/#station#.yml&a!"
  station-create-failed: "&c¡La estación &f#station# &cya existe o no se pudo crear!"
  station-deleted: "&a¡Estación de fabricación eliminada con éxito: &ecrafting-station/#station#.yml&a!"
  station-delete-failed: "&c¡La estación &f#station# &cno existe o no se pudo eliminar!"
  craft-success: "&a¡Fabricado con éxito &f#amount#x &areceta &e#recipe#&a!"
  craft-failed-ingredients: "&c¡No tienes suficientes materiales para fabricar esta receta!"
  craft-failed-inventory-full: "&c¡Tu inventario está lleno! No se pueden fabricar objetos."
  craft-countdown-start: "&eFabricando &f#recipe#&e... ¡Por favor no cierres el menú! (&f#time#s&e)"
  craft-completed: "&a¡Fabricación completada para &e#recipe#&a!"
  craft-failed: "&c¡La fabricación falló por falta de materiales!"
  craft-in-progress: "&c¡Ya estás fabricando un objeto, espera a que termine!"
  craft-cancelled: "&c¡Fabricación cancelada porque se cerró el menú!"
  station-closed-reload: "&eTu menú de estación de fabricación se cerró de forma segura porque se está recargando RoyItems."

  # Notificaciones de Bonificación de Conjunto
  set-bonus-activated: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &a¡Has activado la bonificación de conjunto para &e#set#&a!"
  set-bonus-deactivated: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> &c¡La bonificación de conjunto para &e#set# &cha sido desactivada!"

  # Recompensas de Vales
