config-version: 1

prefix: "&6RoyItems &8» &f"

messages:
  no-permission: "&c이 명령어를 실행할 권한이 없습니다."
  player-only: "&c이 명령어는 게임 내 플레이어만 실행할 수 있습니다."
  reload-success: "&a모든 설정, 아이템 및 로어 템플릿을 성공적으로 다시 불러왔습니다!"
  reload-report-header: "&e&m-----------------&r &6RoyItems LiveUpdate &e&m-----------------"
  reload-report-inventory: " &7• &f플레이어 인벤토리: &a#count# &7개 아이템 업데이트됨"
  reload-report-enderchest: " &7• &f엔더 상자: &a#count# &7개 아이템 업데이트됨"
  reload-report-total: " &7• &f총 동기화됨: &e#count# &7개 아이템 (&b#players# &7명 접속 중)"
  reload-report-failed: " &7• &f실패: &c#count#"
  reload-report-footer: "&e&m----------------------------------------------------"
  item-given: "&a#item# &f#amount#개&a를 지급받았습니다!"
  item-taken: "&a인벤토리에서 &f#amount#개&a의 #item#&a을(를) 제거했습니다."
  item-expired: "&c인벤토리에 있는 아이템의 유효 기간이 만료되어 소멸했습니다!"
  socket-success: "&a소켓 ##slot#&a에 &f#gem#&a을(를) 성공적으로 장착했습니다!"
  socket-incompatible: "&c이 아이템에서 호환되는 빈 소켓을 찾을 수 없습니다!"
  requirement-failed: "&c이 아이템을 장착하기 위한 요구 조건을 만족하지 못했습니다!"
  cooldown-active: "&c이 아이템은 현재 재사용 대기시간입니다! (남은 시간: &f#time#초&c)"
  editor-locked: "&c이 아이템은 현재 다른 관리자가 편집 중입니다!"

  # 업데이트 알림 (관리자 접속 및 리로드 시)
  update-available:
    - "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> <green>새로운 버전이 출시되었습니다!</green>"
    - " <gray>• 현재 버전: <red>v#current#</red></gray>"
    - " <gray>• 최신 버전: <green>v#latest#</green></gray>"
    - " <gray>• 다운로드: <click:open_url:'#url#'><hover:show_text:'<gray>클릭하여 릴리스 페이지 열기'><underlined><aqua>#url#</aqua></underlined></hover></click></gray>"
    - " <gray>• <italic>안정성과 최신 기능을 위해 플러그인을 업데이트해 주세요!</italic></gray>"

  # 명령어 /ri checkupdate
  checkupdate-checking: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> <gray>원격 저장소에서 업데이트를 확인하고 있습니다...</gray>"
  checkupdate-up-to-date:
    - "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> <green>현재 RoyItems의 최신 버전을 실행 중입니다.</green>"
    - " <gray>• 현재 버전: <aqua>v#current#</aqua></gray>"
    - " <gray>• 상태: <green>최신 상태</green></gray>"
    - " <gray>• 대기 중인 업데이트가 없으며 원활하게 실행 중입니다.</gray>"
  checkupdate-update-found:
    - "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> <yellow>RoyItems의 새로운 버전을 사용할 수 있습니다!</yellow>"
    - " <gray>• 현재 버전: <red>v#current#</red></gray>"
    - " <gray>• 최신 버전: <green>v#latest#</green></gray>"
    - " <gray>• 앞서 출시된 새 버전 수: <gold>#behind#</gold>개</gray>"
    - " <gray>• 다운로드: <click:open_url:'#url#'><hover:show_text:'<gray>클릭하여 릴리스 페이지 열기'><underlined><aqua>#url#</aqua></underlined></hover></click></gray>"
    - " <gray>• 최신 기능과 성능 향상을 위해 조속히 업데이트하는 것을 권장합니다.</gray>"
  checkupdate-error: "<gradient:#FFD166:#06D6A0>RoyItems</gradient> <dark_gray>»</dark_gray> <red>업데이트를 확인할 수 없습니다. 네트워크 연결을 확인하거나 나중에 다시 시도해 주세요.</red>"
