# ==============================================================================
#                      ROYITEMS — INGAME GUI EDITOR
# Paginated MMOItems-style Ingame Item Editor configuration.
# Fully supports MiniMessage (<gold>, <bold>...), Hex (<#RRGGBB>), and legacy & codes.
# Anti-Italic by default: italic formatting only appears when using &o or <i>.
# ==============================================================================
config-version: 1

# Item Type Selector (Main Dashboard)
type-selector:
  title: "<gold><bold>RoyItems</bold></gold> <dark_gray>—</dark_gray> <yellow>Select Category</yellow>"
  rows: 6
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  close-button:
    slot: 49
    material: BARRIER
    name: "<#EF476F><bold>Close Menu</bold></#EF476F>"
    lore:
      - "<gray>Click to exit the editor."
  type-item:
    name: "<#FFD166><bold>%type%</bold></#FFD166>"
    lore:
      - "<gray>Category: <white>%description%</white>"
      - "<gray>Total Items: <#06D6A0>%count%</#06D6A0>"
      - ""
      - "<#FFD166>▶ Click to browse and manage items!</#FFD166>"

# Item Browser (Category View)
item-browser:
  title: "<gold><bold>RoyItems</bold></gold> <dark_gray>—</dark_gray> <yellow>%type% (%count%)</yellow>"
  rows: 6
  page-size: 28
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  buttons:
    back:
      slot: 45
      material: ARROW
      name: "<#FFD166><bold>◀ Back to Categories</bold></#FFD166>"
      lore:
        - "<gray>Return to the main category selector."
    prev-page:
      slot: 48
      material: SPECTRAL_ARROW
      name: "<#FFD166>Previous Page</#FFD166>"
    create-item:
      slot: 49
      material: NETHERITE_UPGRADE_SMITHING_TEMPLATE
      name: "<#06D6A0><bold>+ Create New Item</bold></#06D6A0>"
      lore:
        - "<gray>Create a new custom item in <yellow>%type%</yellow>."
    next-page:
      slot: 50
      material: SPECTRAL_ARROW
      name: "<#FFD166>Next Page</#FFD166>"
    close:
      slot: 53
      material: BARRIER
      name: "<#EF476F><bold>Close Menu</bold></#EF476F>"
  item-actions-lore:
    - ""
    - "<#FFD166>Left-Click: <white>Edit properties in detail</white></#FFD166>"
    - "<#118AB2>Right-Click: <white>Give 1x item to your inventory</white></#118AB2>"
    - "<#EF476F>Shift + Right-Click: <white>Delete item permanently</white></#EF476F>"

# Paginated Detail Item Editor
detail-editor:
  title: "<gold><bold>RoyItems</bold></gold> <dark_gray>—</dark_gray> <yellow>%id%</yellow> <gray>(%page%/%max_pages%)</gray>"
  rows: 6
  max-pages: 3
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  # Live Item Preview at Row 1
  preview:
    slot: 4
    lore-hint:
      - ""
      - "<#06D6A0>▶ Click to take a 1x copy into your inventory!</#06D6A0>"

  # Navigation controls at Row 6
  navigation:
    back:
      slot: 45
      material: ARROW
      name: "<#FFD166><bold>◀ Back</bold></#FFD166>"
      lore:
        - "<gray>Return to the item list."
    prev-page:
      slot: 48
      material: SPECTRAL_ARROW
      name: "<#FFD166>◀ Previous Page <gray>(%prev_page%/%max_pages%)</gray></#FFD166>"
      lore:
        - "<gray>Switch to the previous property page."
    save:
      slot: 49
      material: EMERALD_BLOCK
      name: "<#06D6A0><bold>✔ Save Changes</bold></#06D6A0>"
      lore:
        - "<gray>Save all modifications to file</gray>"
        - "<gray>and trigger instant LiveUpdate.</gray>"
    next-page:
      slot: 50
      material: SPECTRAL_ARROW
      name: "<#FFD166>Next Page <gray>(%next_page%/%max_pages%)</gray> ▶</#FFD166>"
      lore:
        - "<gray>Switch to the next property page."
    close:
      slot: 53
      material: BARRIER
      name: "<#EF476F><bold>Close Menu</bold></#EF476F>"

  # ============================================================================
  # PAGINATED PROPERTIES
  # Each property has an independent icon, configured page (1-3), and slot (0-53)
  # ============================================================================
  properties:

    # --------------------------------------------------------------------------
    # PAGE 1: GENERAL & VISUALS
    # --------------------------------------------------------------------------
    material:
      page: 1
      slot: 10
      material: ANVIL
      name: "<#FFD166>Material"
      lore:
        - "<gray>Vanilla Minecraft material of this item."
        - "<dark_gray>▪ <gray>Current: <white>%value%</white>"
        - ""
        - "<#FFD166>Left-Click: <white>Enter new Material in Chat</white>"
        - "<#118AB2>Right-Click: <white>Cycle common materials</white>"

    name:
      page: 1
      slot: 11
      material: NAME_TAG
      name: "<#FFD166>Display Name"
      lore:
        - "<gray>In-game display name for this item."
        - "<dark_gray>▪ <gray>Current: <white>%value%</white>"
        - ""
        - "<#FFD166>Left-Click: <white>Enter new name in Chat</white>"
        - "<#EF476F>Right-Click: <white>Reset to default name</white>"

    lore:
      page: 1
      slot: 12
      material: WRITABLE_BOOK
      name: "<#FFD166>Item Lore"
      lore:
        - "<gray>Custom description lines in item tooltip."
        - "<dark_gray>▪ <gray>Current: <white>%count% lines</white>"
        - ""
        - "<#FFD166>Left-Click: <white>Add a new line via Chat</white>"
        - "<#EF476F>Right-Click: <white>Remove last line</white>"
        - "<#EF476F>Shift + Right-Click: <white>Clear all lore</white>"

    item-model:
      page: 1
      slot: 13
      material: PAINTING
      name: "<#FFD166>Custom Item Model"
      lore:
        - "<gray>Custom Model identifier for 1.21.4+ Resource Packs."
        - "<dark_gray>▪ <gray>Current: <white>%value%</white>"
        - ""
        - "<#FFD166>Left-Click: <white>Enter Model ID via Chat</white>"
        - "<#EF476F>Right-Click: <white>Remove Custom Model</white>"

    lore-format:
      page: 1
      slot: 14
      material: MAP
      name: "<#FFD166>Lore Template"
      lore:
        - "<gray>Lore format layout from lore-format/."
        - "<dark_gray>▪ <gray>Current: <white>%value%</white>"
        - ""
        - "<#FFD166>Left-Click: <white>Switch to next template</white>"
        - "<#EF476F>Right-Click: <white>Reset to 'default'</white>"

    unbreakable:
      page: 1
      slot: 15
