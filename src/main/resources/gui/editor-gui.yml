# ==============================================================================
#                      ROYITEMS — INGAME GUI EDITOR
# Cấu hình giao diện Ingame Editor theo phong cách phân trang MMOItems.
# Hỗ trợ MiniMessage (<gold>, <bold>...), Hex (<#RRGGBB>) và mã màu & thông thường.
# Tự động Anti-Italic theo chuẩn, chữ nghiêng chỉ hiển thị khi có thẻ &o hoặc <i>.
# ==============================================================================

# Bảng chọn Type vật phẩm (Main Dashboard)
type-selector:
  title: "<gold><bold>RoyItems</bold></gold> <dark_gray>—</dark_gray> <yellow>Chọn Danh Mục</yellow>"
  rows: 6
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  close-button:
    slot: 49
    material: BARRIER
    name: "<#EF476F><bold>Đóng Menu</bold></#EF476F>"
    lore:
      - "<gray>Click để thoát khỏi giao diện Editor."
  type-item:
    name: "<#FFD166><bold>%type%</bold></#FFD166>"
    lore:
      - "<gray>Phân loại: <white>%description%</white>"
      - "<gray>Tổng số vật phẩm: <#06D6A0>%count%</#06D6A0>"
      - ""
      - "<#FFD166>▶ Click để xem và quản lý danh sách!</#FFD166>"

# Trình duyệt danh sách vật phẩm (Item Browser)
item-browser:
  title: "<gold><bold>RoyItems</bold></gold> <dark_gray>—</dark_gray> <yellow>%type% (%count%)</yellow>"
  rows: 6
  page-size: 28
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  buttons:
    back:
      slot: 45
      material: ARROW
      name: "<#FFD166><bold>◀ Quay Lại Danh Mục</bold></#FFD166>"
      lore:
        - "<gray>Trở về bảng chọn danh mục vật phẩm."
    prev-page:
      slot: 48
      material: SPECTRAL_ARROW
      name: "<#FFD166>Trang Trước</#FFD166>"
    create-item:
      slot: 49
      material: NETHERITE_UPGRADE_SMITHING_TEMPLATE
      name: "<#06D6A0><bold>+ Tạo Vật Phẩm Mới</bold></#06D6A0>"
      lore:
        - "<gray>Tạo nhanh vật phẩm mới trong <yellow>%type%</yellow>."
    next-page:
      slot: 50
      material: SPECTRAL_ARROW
      name: "<#FFD166>Trang Tiếp Theo</#FFD166>"
    close:
      slot: 53
      material: BARRIER
      name: "<#EF476F><bold>Đóng Menu</bold></#EF476F>"
  item-actions-lore:
    - ""
    - "<#FFD166>Chuột trái: <white>Chỉnh sửa chi tiết thuộc tính</white></#FFD166>"
    - "<#118AB2>Chuột phải: <white>Lấy 1x vật phẩm vào túi đồ</white></#118AB2>"
    - "<#EF476F>Shift + Phải: <white>Xóa vĩnh viễn vật phẩm</white></#EF476F>"

# Giao diện chỉnh sửa chi tiết phân trang (MMOItems-style Paginated Item Editor)
detail-editor:
  title: "<gold><bold>RoyItems</bold></gold> <dark_gray>—</dark_gray> <yellow>%id%</yellow> <gray>(%page%/%max_pages%)</gray>"
  rows: 6
  max-pages: 3
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  # Live Item Preview tại Hàng 1
  preview:
    slot: 4
    lore-hint:
      - ""
      - "<#06D6A0>▶ Click để lấy 1x bản sao vào túi đồ!</#06D6A0>"

  # Thanh điều khiển điều hướng tại Hàng 6
  navigation:
    back:
      slot: 45
      material: ARROW
      name: "<#FFD166><bold>◀ Quay Lại</bold></#FFD166>"
      lore:
        - "<gray>Trở về danh sách vật phẩm."
    prev-page:
      slot: 48
      material: SPECTRAL_ARROW
      name: "<#FFD166>◀ Trang Trước <gray>(%prev_page%/%max_pages%)</gray></#FFD166>"
      lore:
        - "<gray>Chuyển về trang thuộc tính trước."
    save:
      slot: 49
      material: EMERALD_BLOCK
      name: "<#06D6A0><bold>✔ Lưu Thay Đổi</bold></#06D6A0>"
      lore:
        - "<gray>Lưu toàn bộ thay đổi vào file cấu hình</gray>"
        - "<gray>và kích hoạt LiveUpdate tức thì.</gray>"
    next-page:
      slot: 50
      material: SPECTRAL_ARROW
      name: "<#FFD166>Trang Tiếp Theo <gray>(%next_page%/%max_pages%)</gray> ▶</#FFD166>"
      lore:
        - "<gray>Chuyển sang trang thuộc tính tiếp theo."
    close:
      slot: 53
      material: BARRIER
      name: "<#EF476F><bold>Đóng Menu</bold></#EF476F>"

  # ============================================================================
  # DANH SÁCH THUỘC TÍNH PHÂN TRANG (PAGINATED PROPERTIES)
