dragon_chestplate:
  material: NETHERITE_CHESTPLATE
  name: "&c&lDragon Slayer Chestplate"
  lore:
    - "&7Forged from the tempered scales"
    - "&7of an ancient fire drake."
  lore-format: armor
  unbreakable: true
  stats:
    defense: 45
    damage-reduction: 10%
    max-health: 10
  trim-material: netherite
  trim-pattern: silence
  level-required: 20
  item-tier: epic
  item-set: dragon_slayer
  gem-socket:
    - "1"
    - "ABC"
  version: 1

# ==============================================================================
# Custom 2D Armor (Equippable Component - Minecraft 1.21.2+ / Leaf 26.2+ & Nexo)
# ==============================================================================
# - item-model: Controls the 2D inventory/hand icon (or numeric CustomModelData)
# - equipment-model: Sets minecraft:equippable `asset_id` for the worn 2D body
#   texture (assets/<namespace>/equipment/<id>.json), independent of item-model!
# - Slot auto-detection: _HELMET -> HEAD, _CHESTPLATE -> CHEST,
#   _LEGGINGS -> LEGS, _BOOTS -> FEET (or set `equipment-slot` manually).
#
# Verified Nexo Galaxy V2 Example (uncomment to activate):
# galaxyv2_helmet:
#   material: NETHERITE_HELMET
#   display-name: "<gradient:#A855F7:#38BDF8><bold>Galaxy V2 Helmet</bold></gradient>"
#   item-model: nexo:galaxyv2_helmet
#   equipment-model: nexo:galaxyv2
#   lore-format: default
#   stats:
#     max-health: 20
#     defense: 15
#   version: 1
