# ==============================================================================
#                      ROYITEMS — VOUCHER CONFIGURATION
# ==============================================================================
# VOUCHER items can execute console/player commands and award fixed or random
# currency amounts (Vault, PlayerPoints, ExcellentEconomy).
#
# Supported Command Prefixes (default is [console]):
#   - [console] <command>   or   console: <command>
#   - [player] <command>    or   player: <command>
#
# Supported Placeholders in Commands:
#   - %player%             : Player username
#   - %player_uuid%        : Player Unique ID
#   - %player_displayname% : Player display name
#   - %amount%             : Formatted rewarded currency amount
#   - %currency%           : Friendly currency display name (from config.yml)
#   - %currency_symbol%    : Currency symbol (e.g. $, ✪)
#   - All PlaceholderAPI placeholders if installed (e.g. %player_ping%, etc.)
#
# Supported Currency Types:
#   - VAULT (or MONEY)     : Standard Vault / VaultUnlocked economy
#   - PLAYERPOINTS (POINTS): PlayerPoints plugin
#   - EXCELLENTECONOMY_<id>: ExcellentEconomy currency ID (e.g. EXCELLENTECONOMY_coins, EXCELLENTECONOMY_gems)
#
# Currency Modes:
#   1. Fixed Amount:
#        currency:
#          type: VAULT
#          value: 5000
#   2. Random Gacha Range (Triggers animated Title Gacha rolling!):
#        currency:
#          type: VAULT
#          value:
#            min: 1000
#            max: 20000
# ==============================================================================

# Example 1: Command Voucher (Grants Rank & Items)
vip_scroll:
  material: ENCHANTED_BOOK
  name: "&a&lVIP Privilege Scroll"
  lore:
    - "&7Right-click to redeem your"
    - "&7VIP rank privileges."
    - ""
    - "&eRewards:"
    - " &f• &aVIP Rank &7(Permanent)"
    - " &f• &b5x Diamonds"
    - ""
    - "&eClick &8» &fRight-Click to redeem"
  lore-format: default
  glow: true
  cooldown: 5.0
  item-tier: rare
  commands:
    - "[console] give %player% diamond 5"
    - "[console] lp user %player% parent add vip"
    - "[player] me just redeemed their VIP Privilege Scroll!"
  version: 1

# Example 2: Fixed Economy Voucher (Vault Money)
money_pouch_fixed:
  material: GOLD_NUGGET
  name: "&6&lBag of Gold &7(&e$5,000&7)"
  lore:
    - "&7A pouch filled with shimmering gold."
    - "&7Right-click to deposit &a$5,000 &7into your account."
    - ""
    - "&eValue: &a$5,000"
    - "&eClick &8» &fRight-Click to redeem"
  lore-format: default
  glow: true
  cooldown: 3.0
  item-tier: epic
  currency:
    type: VAULT
    value: 5000
  commands:
    - "[console] tellraw %player% {\"text\":\"§a[Bank] Deposited §e$5,000 §ainto your account!\"}"
  version: 1

# Example 3: Random Gacha Voucher (Vault Money with Title Rolling Animation)
money_lucky_gacha:
  material: EMERALD
  name: "&a&lLucky Money Gacha &7(&e$1,000 - $25,000&7)"
  lore:
    - "&7Test your fortune with this lucky voucher!"
    - "&7Spins a random reward between &a$1,000 &7and &a$25,000&7."
    - ""
    - "&d✦ Features animated Title Gacha rolling!"
    - "&eClick &8» &fRight-Click to test your luck"
  lore-format: default
  glow: true
  cooldown: 5.0
  item-tier: legendary
  currency:
    type: VAULT
    value:
      min: 1000
      max: 25000
  version: 1

